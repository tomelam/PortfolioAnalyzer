# ──────────────────────────────────────────────────────────
# PortfolioAnalyzer configuration (TOML)
# Delete or comment out a key to fall back to the default
# shown at the right‑hand side.
#
# IMPORTANT: Every program option or setting takes its value
# from a command line option, if present, or from its value
# set in the configuration file, if present, or from the
# built-in default -- in that order of precedence.
# ──────────────────────────────────────────────────────────

# -------- General switches --------
# show_plot        = true      # Pop up matplotlib window
# output_snapshot  = false     # Save PNG of equity curve
# quiet            = false     # Suppress interactive prompts
# debug            = false     # Same as passing -d/--debug

# -------- Data files --------
# You may omit either of the following two keys. If you do,
# PortfolioAnalyzer uses the built‑in defaults defined in main.py:
#   benchmark_returns_file → data/reference/NIFTY Total Returns Historical Data.csv
#   risk_free_rates_file   → data/reference/INDIRLTLT01STM.csv
#
# Benchmark (total‑return) CSV
benchmark_returns_file = "data/reference/NIFTY Total Returns Historical Data.csv"
# Risk‑free rate CSV (default: FRED India 10‑Year govt bond rate)
risk_free_rates_file  = "data/reference/INDIRLTLT01STM.csv"
#
# You may omit either of the following two keys. If you do,
# PortfolioAnalyzer uses the built‑in defaults defined in main.py:
#   benchmark_date_format    → "%m/%d/%Y"
#   riskfree_date_format     → "%Y-%m-%d"
#
# Benchmark-data date format
benchmark_date_format = "%m/%d/%Y"
# Risk-free-data date format (FRED INDIRLTLT01STM uses ISO %Y-%m-%d)
riskfree_date_format  = "%Y-%m-%d"

# -------- Data freshness --------
# Reference data (benchmark + risk-free) is a correctness invariant: a run is
# auto-refreshed when a source falls behind its publication cadence, and
# BLOCKED if a source can't be certified current. There are no age-tolerance
# knobs. The single override is allow_stale (CLI: --allow-stale), which
# proceeds with a warning naming the degraded metrics. Default false.
# allow_stale = false

# -------- Output locations --------
# output_dir = "outputs"
