# Config overlay used when capturing AND replaying golden-master data.
#
# Golden/replay runs pass --as-of + --replay-from, which are deterministic
# modes: they neither fetch nor enforce the freshness gate (data pinned
# through the as-of date is current as of that date). So no staleness knobs
# are needed here.
#
# Reference inputs are pinned to FROZEN copies under tests/golden/replay/
# rather than the live data/ files. The live data/ CSVs are rewritten in
# place by the on-run freshness refresh (loaders.data_update); pointing the
# goldens at them would let an ordinary `./pa` run silently change the golden
# inputs and break the suite. Freezing them here mirrors how NAV history and
# the SCSS table are already frozen under replay/, and fully insulates the
# goldens from data/ mutation. Re-copy these two files whenever the goldens
# are re-captured (see test_golden_master.py header). Paths are relative to
# the repo root (main.py runs with cwd=REPO_ROOT).
benchmark_returns_file = "tests/golden/replay/reference/NIFTY Total Returns Historical Data.csv"
risk_free_rates_file   = "tests/golden/replay/reference/INDIRLTLT01STM.csv"
# Gold is now an auto-refreshed reference source too (LBMA Gold Price, USD/oz,
# daily), so pin it to a frozen copy for the gold/SGB-bearing goldens — same
# reasoning as the two above. Re-copy on re-capture.
gold_prices_file       = "tests/golden/replay/reference/gold_lbma_usd_daily.csv"
# USD/INR FX (FRED DEXINUS) is an auto-refreshed reference source too, used by
# the SGB engine to convert rupee coupons to USD; pin it to a frozen copy for
# the SGB-bearing goldens (port-everything). Re-copy on re-capture.
fx_usd_inr_file        = "tests/golden/replay/reference/DEXINUS.csv"
