[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analyzer"
version = "0.1.0+salvage"
description = "Indian portfolio analysis: backtests, metrics, stress tests across mutual funds, gold (SGB), PPF, SCSS, NIFTY benchmark, FRED risk-free rates."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tom Elam" }]
readme = "README.md"

dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.3",
    "requests==2.32.3",
    "toml==0.10.2",
    "urllib3==2.1.0",
    "beautifulsoup4>=4.12.3",
    "statsmodels==0.14.4",
    "matplotlib==3.8.2",
    # matplotlib's font-pattern parser uses pyparsing APIs (parseString/oneOf)
    # that pyparsing>=3.2 deprecated; the warnings get escalated to errors by
    # our pytest filterwarnings. Pin to the last 3.1.x (no such warnings).
    "pyparsing==3.1.4",
    "tabulate",
]

[project.scripts]
portfolio-analyzer = "main:cli"
portfolio-analyzer-update = "data_update_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-mock",
    "responses",
    "freezegun",
    "ruff",
    "mypy",
    "types-requests",
    "pre-commit",
    "vulture",
]
live-gold = [
    "yfinance",
]
# Stealth-browser fetch for niftyindices (the only NIFTY-TRI fetch path).
# After installing, run: playwright install chromium
browser = [
    "playwright",
    "playwright-stealth",
]

[tool.setuptools]
py-modules = [
    "main",
    "data_loader",
    "portfolio_calculator",
    "synthetic_civ",
    "civ_to_returns",
    "bond_calculators",
    "ppf_calculator",
    "extract_gold_inr_from_excel",
    "utils",
    "visualizer",
    # Pure-function math layer.
    "metrics",
    # Post-v0.1: SGB tranche reference + lookup API.
    "sgb_tranches",
    # Phase 1 of the SGB modeling refactor: per-tranche valuation engine.
    "sgb_holdings",
    # Per-drawdown CSV companion to the single-row metrics CSV.
    "drawdowns_csv",
    # Inauguration / defunct-status helpers (per-asset metadata).
    "fund_lifecycle",
    # Cron entrypoint for the data auto-update (portfolio-analyzer-update).
    "data_update_cli",
]
# Cycle 14: all *_loader.py files consolidated into the loaders/ package.
# Cycle 15: timeseries.py + timeseries_civ.py + asset_timeseries.py +
# portfolio_timeseries.py consolidated into the timeseries/ package.
packages = ["loaders", "timeseries"]

[tool.ruff]
line-length = 100
target-version = "py312"
# attic/ holds parked, unwired code preserved for provenance (see
# attic/__init__.py); it is intentionally not held to live lint standards.
extend-exclude = ["attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
# attic/ is parked, unwired code preserved for provenance (see
# attic/__init__.py); exclude it so it doesn't dilute the coverage number.
omit = ["attic/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: golden-master regression tests",
    "integration: end-to-end CLI / multi-module tests",
    "network: requires internet (skipped by default)",
    "vro: Value Research Online parity checks (network + browser extra)",
    "order: legacy ordering marker from pre-Phase-D test suite (effectively a no-op)",
]
addopts = "-ra --strict-markers -m 'not network'"
# Treat deprecation signals as test failures so they can't quietly
# accumulate. DeprecationWarning + PendingDeprecationWarning catch
# stdlib / library-author warnings; FutureWarning catches the
# pandas / numpy "behavior will change in vN.M" notices that tend to
# land as breaking changes a release later.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
]
